# batch.bodylia.in — CONTAINER nginx (web-runtime stage of Dockerfile.web).
# Serves the static Vite SPA on plain port 80 INSIDE the portal container.
# TLS + /api/ + /bff/ are handled by the HOST nginx (deploy/bodyliabatch.conf),
# which proxies / -> 127.0.0.1:18033 and /api/,/bff/ -> 127.0.0.1:18034.
# NOTE: no `batch-api` upstream here — the service name is unresolvable in the
# prod compose network; keep this file free of proxy upstreams so the portal
# boots standalone (verified by `docker run -p 18901:80 batch-portal:verify`).
server {
    listen 80 default_server;
    server_name batch.bodylia.in;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Hashed bundles ship immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # QR deep links: /?b=PE-2610-WL01 must survive (query string preserved by try_files fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
