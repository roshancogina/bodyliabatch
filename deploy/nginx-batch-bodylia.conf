# HTTP to HTTPS redirect
server {
    listen 80;
    server_name batch.bodylia.in;
    return 301 https://$server_name$request_uri;
}

# batch.bodylia.in — Bodylia batch verification portal (static Vite SPA)
server {
    listen 443 ssl http2;
    server_name batch.bodylia.in;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/batch.bodylia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/batch.bodylia.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles ship immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.pdf$ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # QR deep links: /?b=BDL-… must survive (query string preserved by try_files fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
