# batch.bodylia.in — host nginx (server 209.182.235.68).
# House style (cf. activitysports.com): plain-HTTP vhost behind the public
# 80/443 listeners; certbot --nginx adds the 443 block + auto-renewal.
# Upstreams: web SPA on 127.0.0.1:18033, Go API on 127.0.0.1:18034.
# NOTE: /bff/ + /api/ proxy to the API container DIRECTLY (bypassing the web
# container) so API health/smoke checks stay independent of SPA deploys.
server {
    listen 80;
    server_name batch.bodylia.in;

    client_max_body_size 20M;
    proxy_read_timeout    300;
    proxy_connect_timeout 300;
    proxy_send_timeout    300;

    # --- Go API + BFF (direct to api container) ---
    location /bff/ {
        proxy_pass         http://127.0.0.1:18034;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";
        proxy_buffering    off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:18034;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Connection         "";
        proxy_buffering    off;
    }

    # --- Vite SPA (nginx-in-docker) ---
    location / {
        proxy_pass         http://127.0.0.1:18033;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
    }
}
