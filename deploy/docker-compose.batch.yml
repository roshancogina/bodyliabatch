# batch.bodylia.in — full-stack compose (Postgres 17 + Go API + nginx SPA).
# DRY-RUN on Ubuntu 24.04: docker compose -f deploy/docker-compose.batch.yml --env-file .env.deploy up -d --build
# then: ./deploy/dryrun-ubuntu.sh (health, migrations, seed counts, UIBatch smoke).
name: batch-bodylia

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bodyliabatch}
      POSTGRES_USER: ${DB_USER:-bodylia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bodylia} -d ${DB_NAME:-bodyliabatch}"]
      interval: 10s
      timeout: 5s
      retries: 10

  batch-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: bodylia-batch-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8101
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-bodylia}
      DB_NAME: ${DB_NAME:-bodyliabatch}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://batch.bodylia.in}
      GIN_MODE: release
    expose:
      - "8101"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8101/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  batch-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: bodylia-batch-portal:latest
    restart: unless-stopped
    depends_on:
      batch-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4173}:80"
      - "${WEB_TLS_PORT:-4443}:443"

volumes:
  pgdata:

